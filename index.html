<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resonance — Emotion-Driven Music</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #080a0f; --surface: #0e1118; --card: #131720; --border: #1e2535;
  --accent: #c8a96e; --accent2: #6e9ec8; --danger: #c86e6e;
  --text: #e8e4dc; --muted: #6b7280; --radius: 12px;
  --font-head: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'DM Mono', 'Courier New', monospace;
}
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@300;400&display=swap');
html, body { height: 100%; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: 13px; letter-spacing: 0.02em; overflow-x: hidden; }
body::before { content: ''; position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 0; opacity: 0.4; }
.app { position: relative; z-index: 1; min-height: 100vh;
  display: grid; grid-template-rows: auto 1fr auto;
  max-width: 1100px; margin: 0 auto; padding: 0 24px; }
header { padding: 40px 0 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: baseline; gap: 20px; }
.logo { font-family: var(--font-head); font-size: 2.8rem; font-weight: 300;
  letter-spacing: 0.12em; color: var(--text); line-height: 1; }
.logo em { font-style: italic; color: var(--accent); }
.tagline { color: var(--muted); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; }
main { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 32px 0; align-items: start; }
@media (max-width: 720px) { main { grid-template-columns: 1fr; } }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.card-header { padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; }
.card-title { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
.dot.active { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.dot.recording { background: var(--danger); box-shadow: 0 0 8px var(--danger); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.camera-body { padding: 20px; }
#video-preview { width: 100%; aspect-ratio: 4/3; background: #050709; border-radius: 8px;
  border: 1px solid var(--border); display: block; object-fit: cover; }
.camera-controls { display: flex; gap: 10px; margin-top: 16px; }
.btn { flex: 1; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--text); font-family: var(--font-body);
  font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer;
  transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover:not(:disabled) { background: var(--border); border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 400; }
.btn-primary:hover:not(:disabled) { background: #d9bc85; border-color: #d9bc85; color: var(--bg); }
.btn-danger { border-color: var(--danger); color: var(--danger); }
.btn-danger:hover:not(:disabled) { background: var(--danger); color: var(--bg); }
.emotion-body { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
.va-compass-wrap { display: flex; align-items: center; gap: 20px; }
.va-compass { position: relative; width: 140px; height: 140px; flex-shrink: 0; }
.compass-svg { width: 100%; height: 100%; }
.compass-label { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); position: absolute; }
.compass-label.top    { top: 2px;    left: 50%; transform: translateX(-50%); }
.compass-label.bottom { bottom: 2px; left: 50%; transform: translateX(-50%); }
.compass-label.left   { left: 2px;   top:  50%; transform: translateY(-50%); }
.compass-label.right  { right: 2px;  top:  50%; transform: translateY(-50%); }
.va-stats { flex: 1; display: flex; flex-direction: column; gap: 12px; }
.stat-row { display: flex; flex-direction: column; gap: 4px; }
.stat-label { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
.stat-bar-track { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.stat-bar-fill { height: 100%; border-radius: 2px; background: var(--accent);
  transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); width: 0%; }
.stat-bar-fill.arousal { background: var(--accent2); }
.stat-value { font-size: 11px; color: var(--text); font-weight: 400; }
.emotion-pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
  border-radius: 100px; border: 1px solid var(--border); font-size: 12px;
  letter-spacing: 0.1em; color: var(--muted); transition: all 0.4s; width: fit-content; }
.emotion-pill.active { border-color: var(--accent); color: var(--accent); background: rgba(200,169,110,0.08); }
.music-params { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.param-cell { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
.param-key { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.param-val { font-size: 18px; font-family: var(--font-head); font-weight: 300; color: var(--text); line-height: 1; }
.player-panel { grid-column: 1 / -1; }
.player-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.waveform-container { width: 100%; height: 64px; background: var(--surface); border-radius: 8px;
  border: 1px solid var(--border); overflow: hidden; }
#waveform-canvas { width: 100%; height: 100%; display: block; }
.player-controls { display: flex; align-items: center; gap: 16px; }
.play-btn { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--accent);
  background: transparent; color: var(--accent); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; flex-shrink: 0; font-size: 18px; }
.play-btn:hover:not(:disabled) { background: var(--accent); color: var(--bg); }
.play-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.player-meta { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.player-label { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
.player-track { font-family: var(--font-head); font-size: 1.4rem; font-weight: 300; font-style: italic; color: var(--text); }
.progress-track { height: 2px; background: var(--border); border-radius: 1px; margin-top: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s linear; border-radius: 1px; }
.status-log { grid-column: 1 / -1; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 20px; display: flex; align-items: center; gap: 10px; min-height: 48px; }
.status-indicator { width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex-shrink: 0; transition: background 0.3s; }
.status-indicator.loading { background: var(--accent2); animation: pulse 0.8s ease-in-out infinite; }
.status-indicator.success { background: #6ec88a; }
.status-indicator.error   { background: var(--danger); }
.status-text { font-size: 11px; color: var(--muted); flex: 1; }
.spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent2);
  border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; display: none; }
.spinner.visible { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-banner { display: none; grid-column: 1 / -1; background: rgba(200,110,110,0.08);
  border: 1px solid var(--danger); border-radius: 8px; padding: 12px 16px; font-size: 11px; color: var(--danger); }
.error-banner.visible { display: block; }
footer { padding: 20px 0; border-top: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  color: var(--muted); font-size: 10px; letter-spacing: 0.1em; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><em>Res</em>onance</div>
    <div class="tagline">Multimodal Emotion → Music</div>
  </header>
  <main>
    <div class="card">
      <div class="card-header">
        <div class="dot" id="cam-dot"></div>
        <span class="card-title">Camera Input</span>
      </div>
      <div class="camera-body">
        <video id="video-preview" autoplay muted playsinline></video>
        <div class="camera-controls">
          <button class="btn btn-primary" id="btn-start-cam">⬤ &nbsp;Start Camera</button>
          <button class="btn btn-danger"  id="btn-record"    disabled>● &nbsp;Record Clip</button>
          <button class="btn"             id="btn-analyze"   disabled>▶ &nbsp;Analyse</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="dot" id="emotion-dot"></div>
        <span class="card-title">Emotion Reading</span>
      </div>
      <div class="emotion-body">
        <div class="va-compass-wrap">
          <div class="va-compass">
            <span class="compass-label top">High Arousal</span>
            <span class="compass-label bottom">Low Arousal</span>
            <span class="compass-label left">−V</span>
            <span class="compass-label right">+V</span>
            <svg class="compass-svg" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
              <line x1="70" y1="10" x2="70" y2="130" stroke="#1e2535" stroke-width="1"/>
              <line x1="10" y1="70" x2="130" y2="70" stroke="#1e2535" stroke-width="1"/>
              <circle cx="70" cy="70" r="55" fill="none" stroke="#1e2535" stroke-width="1"/>
              <circle cx="70" cy="70" r="28" fill="none" stroke="#1e2535" stroke-width="0.5" stroke-dasharray="2 4"/>
              <circle id="va-point" cx="70" cy="70" r="6" fill="none" stroke="#c8a96e" stroke-width="2"
                style="transition: cx 0.6s cubic-bezier(0.34,1.56,0.64,1), cy 0.6s cubic-bezier(0.34,1.56,0.64,1)"/>
              <circle id="va-dot"   cx="70" cy="70" r="3" fill="#c8a96e"
                style="transition: cx 0.6s cubic-bezier(0.34,1.56,0.64,1), cy 0.6s cubic-bezier(0.34,1.56,0.64,1)"/>
            </svg>
          </div>
          <div class="va-stats">
            <div class="stat-row">
              <div class="stat-label">Valence</div>
              <div class="stat-bar-track"><div class="stat-bar-fill" id="bar-valence"></div></div>
              <div class="stat-value" id="val-valence">—</div>
            </div>
            <div class="stat-row">
              <div class="stat-label">Arousal</div>
              <div class="stat-bar-track"><div class="stat-bar-fill arousal" id="bar-arousal"></div></div>
              <div class="stat-value" id="val-arousal">—</div>
            </div>
          </div>
        </div>
        <div class="emotion-pill" id="emotion-pill"><span>○</span><span id="emotion-text">Awaiting clip…</span></div>
        <div class="music-params">
          <div class="param-cell"><div class="param-key">Key</div>   <div class="param-val" id="param-key">—</div></div>
          <div class="param-cell"><div class="param-key">Tempo</div> <div class="param-val" id="param-tempo">—</div></div>
          <div class="param-cell"><div class="param-key">Mode</div>  <div class="param-val" id="param-mode">—</div></div>
          <div class="param-cell"><div class="param-key">Instrument</div><div class="param-val" id="param-instr">—</div></div>
        </div>
      </div>
    </div>
    <div class="error-banner" id="error-banner"></div>
    <div class="status-log">
      <div class="status-indicator" id="status-dot"></div>
      <div class="spinner" id="spinner"></div>
      <div class="status-text" id="status-text">Click "Start Camera" to begin.</div>
    </div>
    <div class="card player-panel">
      <div class="card-header">
        <div class="dot" id="player-dot"></div>
        <span class="card-title">Music Output</span>
      </div>
      <div class="player-body">
        <div class="waveform-container"><canvas id="waveform-canvas"></canvas></div>
        <div class="player-controls">
          <button class="play-btn" id="btn-play" disabled>▶</button>
          <div class="player-meta">
            <div class="player-label">Now Playing</div>
            <div class="player-track" id="track-title">—</div>
            <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer>
    <span>CREMA-D Multimodal Emotion System</span>
    <span>Valence–Arousal → MIDI Generation</span>
  </footer>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const API_BASE    = "http://localhost:5000";
const RECORD_SECS = 5;

// ── DOM ───────────────────────────────────────────────────────────────────────
const videoEl      = document.getElementById("video-preview");
const btnStartCam  = document.getElementById("btn-start-cam");
const btnRecord    = document.getElementById("btn-record");
const btnAnalyze   = document.getElementById("btn-analyze");
const btnPlay      = document.getElementById("btn-play");
const camDot       = document.getElementById("cam-dot");
const emotionDot   = document.getElementById("emotion-dot");
const playerDot    = document.getElementById("player-dot");
const statusDot    = document.getElementById("status-dot");
const spinner      = document.getElementById("spinner");
const statusText   = document.getElementById("status-text");
const emotionPill  = document.getElementById("emotion-pill");
const emotionText  = document.getElementById("emotion-text");
const errorBanner  = document.getElementById("error-banner");
const barValence   = document.getElementById("bar-valence");
const barArousal   = document.getElementById("bar-arousal");
const valValence   = document.getElementById("val-valence");
const valArousal   = document.getElementById("val-arousal");
const vaPoint      = document.getElementById("va-point");
const vaDot        = document.getElementById("va-dot");
const paramKey     = document.getElementById("param-key");
const paramTempo   = document.getElementById("param-tempo");
const paramMode    = document.getElementById("param-mode");
const paramInstr   = document.getElementById("param-instr");
const trackTitle   = document.getElementById("track-title");
const progressFill = document.getElementById("progress-fill");
const waveCanvas   = document.getElementById("waveform-canvas");

// ── State ─────────────────────────────────────────────────────────────────────
let stream = null, mediaRecorder = null, recordedChunks = [], recordedBlob = null;
let scheduledNotes = [], toneBpm = 120;
let synth = null, chordSynth = null, bassSynth = null;
let isPlaying = false, playStartTime = 0, playDuration = 0, rafId = null;
let toneAnalyser = null;

// ── Status helpers ────────────────────────────────────────────────────────────
function setStatus(msg, state = "idle") {
  statusText.textContent = msg;
  statusDot.className = "status-indicator " + (state === "idle" ? "" : state);
  spinner.className   = "spinner" + (state === "loading" ? " visible" : "");
}
function showError(msg) { errorBanner.textContent = msg; errorBanner.className = "error-banner visible"; setStatus("Error.", "error"); }
function clearError()   { errorBanner.className = "error-banner"; }

// ── Camera ────────────────────────────────────────────────────────────────────
btnStartCam.addEventListener("click", async () => {
  clearError();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError("Camera not available. Open via http://localhost:8080/index.html instead of file://");
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    videoEl.srcObject    = stream;
    camDot.className     = "dot active";
    btnRecord.disabled   = false;
    btnStartCam.disabled = true;
    setStatus("Camera ready. Record a " + RECORD_SECS + "-second clip.", "success");
  } catch (e) {
    if (e.name === "NotAllowedError") {
      showError("Camera permission denied. Go to System Settings → Privacy & Security → Camera and enable Chrome.");
    } else {
      showError("Camera error: " + e.name + " — " + e.message);
    }
  }
});

// ── Recording ─────────────────────────────────────────────────────────────────
btnRecord.addEventListener("click", () => {
  if (mediaRecorder && mediaRecorder.state === "recording") return;
  clearError();
  recordedChunks = []; recordedBlob = null;
  btnAnalyze.disabled = true; btnPlay.disabled = true;

  const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")
    ? "video/webm;codecs=vp9,opus" : "video/webm";
  mediaRecorder = new MediaRecorder(stream, { mimeType });
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    recordedBlob = new Blob(recordedChunks, { type: mimeType });
    camDot.className = "dot active";
    btnRecord.innerHTML = "● &nbsp;Record Clip";
    btnAnalyze.disabled = false;
    setStatus("Clip recorded (" + (recordedBlob.size/1024).toFixed(0) + " KB). Click Analyse.", "success");
  };
  mediaRecorder.start();
  camDot.className = "dot recording";
  btnRecord.innerHTML = "■ &nbsp;Recording…";

  let remaining = RECORD_SECS;
  const timer = setInterval(() => {
    remaining--;
    setStatus("Recording… " + remaining + "s remaining", "loading");
    if (remaining <= 0) { clearInterval(timer); mediaRecorder.stop(); }
  }, 1000);
  setStatus("Recording " + RECORD_SECS + "s clip…", "loading");
});

// ── Analyse ───────────────────────────────────────────────────────────────────
btnAnalyze.addEventListener("click", async () => {
  if (!recordedBlob) return;
  clearError();
  setStatus("Uploading clip and extracting features…", "loading");
  btnAnalyze.disabled = true; btnPlay.disabled = true;

  const formData = new FormData();
  formData.append("video", recordedBlob, "clip.webm");

  try {
    const res = await fetch(API_BASE + "/generate", { method: "POST", body: formData });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      throw new Error(err.error || res.statusText);
    }

    const data = await res.json();
    const { valence, arousal, scale, tempo_bpm, emotion_label, midi_b64 } = data;

    updateEmotionUI(valence, arousal, scale, tempo_bpm, emotion_label);

    // Decode base64 MIDI
    const binary = atob(midi_b64);
    const bytes  = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const midiBlob = new Blob([bytes], { type: "audio/midi" });

    await loadMidi(midiBlob, emotion_label, scale, tempo_bpm);
    btnAnalyze.disabled = false;
    setStatus("Analysis complete. Press ▶ to play.", "success");

  } catch (e) {
    showError("Analysis failed: " + e.message);
    btnAnalyze.disabled = false;
  }
});

// ── Emotion UI ────────────────────────────────────────────────────────────────
function updateEmotionUI(valence, arousal, scale, tempo, label) {
  emotionDot.className  = "dot active";
  emotionPill.className = "emotion-pill active";
  emotionText.textContent = label;
  barValence.style.width = ((valence + 1) / 2 * 100).toFixed(1) + "%";
  barArousal.style.width = (arousal * 100).toFixed(1) + "%";
  valValence.textContent = (valence >= 0 ? "+" : "") + valence.toFixed(3);
  valArousal.textContent = arousal.toFixed(3);
  const cx = 15 + ((valence + 1) / 2) * 110;
  const cy = 125 - arousal * 110;
  vaPoint.setAttribute("cx", cx); vaPoint.setAttribute("cy", cy);
  vaDot.setAttribute("cx", cx);   vaDot.setAttribute("cy", cy);
  const scaleLabels  = { major: "Major", dorian: "Dorian", minor: "Minor" };
  const rootNames    = { major: "G", dorian: "D", minor: "F" };
  const instruments  = { major: arousal >= 0.5 ? "Piano" : "Vibraphone", dorian: "Flute", minor: "Bassoon" };
  paramKey.textContent   = rootNames[scale]    || "C";
  paramTempo.textContent = tempo + " BPM";
  paramMode.textContent  = scaleLabels[scale]  || scale;
  paramInstr.textContent = instruments[scale]  || "Piano";
}

// ── MIDI parser ───────────────────────────────────────────────────────────────
function parseMidi(bytes) {
  let pos = 0;
  function readUint32() { const b=bytes.slice(pos,pos+4);pos+=4;return(b[0]<<24)|(b[1]<<16)|(b[2]<<8)|b[3]; }
  function readUint16() { const b=bytes.slice(pos,pos+2);pos+=2;return(b[0]<<8)|b[1]; }
  function readVarLen() { let v=0,b;do{b=bytes[pos++];v=(v<<7)|(b&0x7f);}while(b&0x80);return v; }
  pos+=4; pos+=4;
  const format=readUint16(), numTracks=readUint16(), division=readUint16();
  const notes=[];
  for(let t=0;t<numTracks;t++){
    pos+=4; const trackLen=readUint32(); const trackEnd=pos+trackLen;
    let tick=0,lastStatus=0;
    while(pos<trackEnd){
      const delta=readVarLen(); tick+=delta;
      let sb=bytes[pos];
      if(sb&0x80){lastStatus=sb;pos++;}else{sb=lastStatus;}
      const type=sb>>4, channel=sb&0x0f;
      if(type===0x09){
        const note=bytes[pos++],vel=bytes[pos++];
        if(vel>0) notes.push({time:tick/division*4,duration:2,note,velocity:vel,channel});
      } else if(type===0x08){pos+=2;}
        else if(type===0x0a){pos+=2;}
        else if(type===0x0b){pos+=2;}
        else if(type===0x0c){pos+=1;}
        else if(type===0x0d){pos+=1;}
        else if(type===0x0e){pos+=2;}
        else if(type===0x0f){
          if(sb===0xff){pos++;const ml=readVarLen();pos+=ml;}
          else{while(bytes[pos++]!==0xf7&&pos<trackEnd){}}
        } else{pos++;}
    }
    pos=trackEnd;
  }
  return notes;
}

function midiNoteToName(midi) {
  return ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"][midi%12] + (Math.floor(midi/12)-1);
}

// ── Load MIDI ─────────────────────────────────────────────────────────────────
async function loadMidi(midiBlob, label, scale, tempo) {
  const buf  = await midiBlob.arrayBuffer();
  const notes = parseMidi(new Uint8Array(buf));
  scheduledNotes         = notes;
  toneBpm                = parseInt(tempo) || 120;
  trackTitle.textContent = label + " — " + scale + " " + toneBpm + " BPM";
  playerDot.className    = "dot active";
  btnPlay.disabled       = false;
  btnPlay.textContent    = "▶";
  isPlaying              = false;
  progressFill.style.width = "0%";
}

// ── Playback ──────────────────────────────────────────────────────────────────
btnPlay.addEventListener("click", async () => {
  if (!scheduledNotes.length) return;

  if (isPlaying) {
    Tone.Transport.stop(); Tone.Transport.cancel();
    isPlaying = false; btnPlay.textContent = "▶";
    progressFill.style.width = "0%"; cancelAnimationFrame(rafId);
    return;
  }

  await Tone.start();
  Tone.Transport.bpm.value = toneBpm;
  Tone.Transport.cancel();

  if (synth)      synth.dispose();
  if (chordSynth) chordSynth.dispose();
  if (bassSynth)  bassSynth.dispose();

  synth = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope:   { attack: 0.04, decay: 0.15, sustain: 0.65, release: 1.2 },
    volume: -6,
  }).toDestination();

  chordSynth = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "sine" },
    envelope:   { attack: 0.08, decay: 0.3, sustain: 0.75, release: 2.0 },
    volume: -14,
  }).toDestination();

  bassSynth = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope:   { attack: 0.02, decay: 0.1, sustain: 0.8, release: 0.5 },
    volume: -10,
  }).toDestination();

  let maxTime = 0;
  scheduledNotes.forEach(({ time, duration, note, channel }) => {
    const toneNote = midiNoteToName(note);
    const beats    = time / 4;
    const durBeats = Math.max(duration / 4, 0.1);
    if (channel === 2) {
      Tone.Transport.schedule(t => { try { bassSynth.triggerAttackRelease(toneNote, durBeats + "n", t); } catch(e){} }, beats + "n");
    } else {
      const s = channel === 0 ? synth : chordSynth;
      Tone.Transport.schedule(t => { try { s.triggerAttackRelease(toneNote, durBeats + "n", t); } catch(e){} }, beats + "n");
    }
    maxTime = Math.max(maxTime, time + duration);
  });

  playDuration  = (maxTime / 4 / toneBpm) * 60;
  playStartTime = Tone.now();
  Tone.Transport.start();
  isPlaying = true; btnPlay.textContent = "■";

  function animateProgress() {
    if (!isPlaying) return;
    const pct = Math.min((Tone.now() - playStartTime) / playDuration * 100, 100);
    progressFill.style.width = pct + "%";
    if (pct >= 100) { isPlaying = false; btnPlay.textContent = "▶"; progressFill.style.width = "0%"; return; }
    rafId = requestAnimationFrame(animateProgress);
  }
  animateProgress();
  animateWaveform();
});

// ── Waveform ──────────────────────────────────────────────────────────────────
function animateWaveform() {
  const ctx = waveCanvas.getContext("2d");
  waveCanvas.width  = waveCanvas.offsetWidth  * (window.devicePixelRatio||1);
  waveCanvas.height = waveCanvas.offsetHeight * (window.devicePixelRatio||1);
  ctx.scale(window.devicePixelRatio||1, window.devicePixelRatio||1);
  if (!toneAnalyser) {
    toneAnalyser = new Tone.Analyser("waveform", 256);
    Tone.Destination.connect(toneAnalyser);
  }
  function draw() {
    if (!isPlaying) {
      ctx.clearRect(0,0,waveCanvas.offsetWidth,waveCanvas.offsetHeight);
      ctx.strokeStyle="#1e2535"; ctx.lineWidth=1.5; ctx.beginPath();
      ctx.moveTo(0,waveCanvas.offsetHeight/2); ctx.lineTo(waveCanvas.offsetWidth,waveCanvas.offsetHeight/2);
      ctx.stroke(); return;
    }
    const w=waveCanvas.offsetWidth, h=waveCanvas.offsetHeight, data=toneAnalyser.getValue();
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle="#c8a96e"; ctx.lineWidth=1.5; ctx.shadowColor="#c8a96e"; ctx.shadowBlur=6;
    ctx.beginPath();
    data.forEach((v,i) => { const x=i*(w/data.length), y=h/2+v*h*0.45; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
    ctx.stroke(); ctx.shadowBlur=0;
    rafId = requestAnimationFrame(draw);
  }
  draw();
}

// Draw flat line on load
(function(){
  const ctx=waveCanvas.getContext("2d");
  waveCanvas.width=waveCanvas.offsetWidth*(window.devicePixelRatio||1);
  waveCanvas.height=waveCanvas.offsetHeight*(window.devicePixelRatio||1);
  ctx.scale(window.devicePixelRatio||1,window.devicePixelRatio||1);
  ctx.strokeStyle="#1e2535"; ctx.lineWidth=1.5; ctx.beginPath();
  ctx.moveTo(0,waveCanvas.offsetHeight/2); ctx.lineTo(waveCanvas.offsetWidth,waveCanvas.offsetHeight/2);
  ctx.stroke();
})();
</script>
</body>
